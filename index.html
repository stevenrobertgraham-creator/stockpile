<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1a26"><title>Stockpile</title>
<style>
:root{--bg:#0b1a26;--card:#132636;--line:#21394d;--ink:#e8f0f5;--mute:#8ba3b5;--food:#ffb43a;--water:#35d4cf;--pro:#ff6f5e;--fat:#a597ff;--ok:#6fe3a0}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Roboto,"Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:auto;padding:16px 16px 140px}
h1{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-bottom:12px}h2{font-size:15px;font-weight:600;margin:18px 0 8px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{position:relative;text-align:center}.ring svg{width:100%;max-width:150px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:38px;line-height:1;font-weight:800}
.ring b small{font-size:12px;font-weight:500;color:var(--mute);margin-top:4px}
.ring p{color:var(--mute);font-size:13px;margin-top:4px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.row:first-child{border:0}
.row small,.mute{color:var(--mute)}.lim{color:var(--pro);font-weight:600}
button,input{font:inherit;color:inherit}
button{background:var(--line);border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
button.pri{background:var(--food);color:#1b1200;font-weight:700}
input{background:#0b1a26;border:1px solid var(--line);border-radius:12px;padding:10px;width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.seg button.on{background:var(--water);color:#032;font-weight:700}.seg button.on.out{background:var(--pro);color:#2a0600}
video{width:100%;border-radius:18px;background:#000;aspect-ratio:4/3;object-fit:cover}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0f2130;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border-radius:0;padding:14px 4px;color:var(--mute);font-size:13px}nav button.on{color:var(--food);font-weight:700}
#toast{z-index:20;position:fixed;left:16px;right:16px;bottom:84px;background:#e8f0f5;color:#08131c;padding:12px 14px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}.q{display:flex;gap:6px;align-items:center}.q button{padding:6px 12px}
select{background:#0b1a26;border:1px solid var(--line);border-radius:12px;padding:10px;width:100%;color:inherit;font:inherit}
.guide{position:absolute;left:7%;right:7%;top:30%;bottom:30%;border:2px solid var(--food);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
.guide::after{content:"";position:absolute;left:6px;right:6px;top:12%;height:2px;background:var(--pro);animation:sc 1.6s ease-in-out infinite alternate}
@keyframes sc{from{top:12%}to{top:88%}}
@media(prefers-reduced-motion:reduce){.guide::after{animation:none}}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main id="app"></main><div id="toast"></div>
<nav><button data-v="home">Dashboard</button><button data-v="scan">Scan</button><button data-v="pantry">Pantry</button><button data-v="setup">Household</button></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
// PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings > Your apps > Web app)
const FIREBASE_CONFIG={apiKey:"AIzaSyDQOaAl6v_T9GeA1G1Jtn7zvkXz2W6rmnQ",authDomain:"stockpile-774a8.firebaseapp.com",projectId:"stockpile-774a8",appId:"1:562244288833:web:78a4890b548fb11bd5e1c0"};
const USDA_KEY="DEMO_KEY"; // free key: fdc.nal.usda.gov/api-key-signup (DEMO_KEY is limited to about 30 lookups per hour)
const $=s=>document.querySelector(s);
let S={people:2,kcal:2000,water:3.8,waterL:0,items:{}};
let hid=localStorage.getItem('hid')||'',db,unsubs=[];
const P=new URLSearchParams(location.search).get('h');
let view='home',mode='in',stream,timer,last={c:'',t:0};
const H=()=>db.collection('households').doc(hid),INC=firebase.firestore.FieldValue.increment;
const f1=n=>(Math.round(n*10)/10).toString();
const tz=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4);
const today=()=>tz().toISOString().slice(0,10);
const inM=m=>{const d=tz();d.setUTCMonth(d.getUTCMonth()+m);return d.toISOString().slice(0,10)};
const lots=i=>i.lots||(i.qty?[{d:'',n:i.qty}]:[]);
const total=i=>lots(i).reduce((a,l)=>a+l.n,0);
const valid=i=>lots(i).reduce((a,l)=>a+(l.d&&l.d<today()?0:l.n),0);
const CATS=['Meat, fish & protein','Vegetables','Fruit','Soups & ready meals','Grains, pasta & rice','Beans & legumes','Bread, cereal & crackers','Baking & cooking staples','Spreads, nuts & seeds','Snacks, bars & sweets','Dairy & eggs','Frozen','Drinks','Condiments, sauces & spices','Other'];
const catOf=i=>CATS.includes(i.cat)?i.cat:'Other';
const RULES=[['Frozen',/frozen/],['Drinks',/beverage|waters|juices|sodas|coffees|drinks| teas | tea-/],['Condiments, sauces & spices',/sauces|condiments|spices|herbs|ketchup|mustards|mayonnaise|vinegars|seasoning|dressings|salsas|pickles/],['Soups & ready meals',/soups|ready-meals|prepared-meals|instant-noodle|pizzas|dishes|canned-meals/],['Snacks, bars & sweets',/snacks|bars|candies|chocolates|confectioner|biscuits|cookies|chips|crisps|cakes|sweets|pastries|waffles|popcorn|gummies/],['Dairy & eggs',/ (dairies|milks|cheeses|yogurts|eggs|butters|creams|fermented-milk-products) /],['Spreads, nuts & seeds',/nuts|seeds|nut-butter|peanut|spreads|jams|honey|almond/],['Meat, fish & protein',/meat|fish|seafood|tuna|sausage|poultry|chicken|beef|pork| hams? |tofu|salmon|sardine|jerky|bacon/],['Beans & legumes',/legume|beans|lentils|chickpeas| peas /],['Baking & cooking staples',/flour|sugars|oils|salt|baking|yeast|margarine|shortening|syrup|starch|fats/],['Grains, pasta & rice',/pastas|rices|noodles|couscous|quinoa|grains|spaghetti|macaroni/],['Bread, cereal & crackers',/ (breads|breakfast-cereals|crackers|tortillas|bagels|mueslis?|granolas?|oatmeals?|oat-flakes|rolled-oats|pancakes) /],['Fruit',/ (fruits|fruits-based-foods|canned-fruits|dried-fruits|fruit-preserves|apples|bananas|berries|peaches|pears|pineapples|oranges) /],['Vegetables',/ (vegetables|vegetables-based-foods|canned-vegetables|potatoes|tomatoes|onions|carrots|corn|mushrooms|sweet-corn) /]];
function guessCat(tags){const t=' '+(tags||[]).map(x=>x.replace(/^[a-z]{2,3}:/,'')).join(' ')+' ';for(const [c,re] of RULES)if(re.test(t))return c;return 'Other'}
const pref=()=>{try{return{sort:'az',cat:true,...JSON.parse(localStorage.getItem('ps'))}}catch(e){return{sort:'az',cat:true}}};
function setPref(k){const o=pref();if(k=='sort')o.sort=o.sort=='az'?'exp':'az';else o.cat=!o.cat;localStorage.setItem('ps',JSON.stringify(o));render()}
let busy=false,lastD=localStorage.getItem('lastd')||'';
function tot(items){const t={k:0,p:0,c:0,f:0};for(const i of Object.values(items)){const m=valid(i)*i.g/100;t.k+=m*i.k;t.p+=m*i.p;t.c+=m*i.c;t.f+=m*i.f}return t}
function need(){const n=S.people,k=S.kcal;return{k:k*n,p:k*.15/4*n,c:k*.5/4*n,f:k*.35/9*n}}
function days(t){const n=need();return{k:t.k/n.k,p:t.p/n.p,c:t.c/n.c,f:t.f/n.f}}
const minD=d=>Math.min(d.k,d.p,d.c,d.f);
const NAMES={k:'Calories',p:'Protein',c:'Carbs',f:'Fat'},COL={k:'var(--food)',p:'var(--pro)',c:'var(--food)',f:'var(--fat)'};
function ring(v,max,col,label,sub){const r=52,C=2*Math.PI*r,p=Math.min(v/max,1);
return `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--line)" stroke-width="11"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><b>${f1(v)}<small>${label}</small></b><p>${sub}</p></div>`}
function recs(){const base=days(tot(S.items)),b=minD(base),out=[];
for(const [code,i] of Object.entries(S.items)){if(!i.g||!i.k)continue;const it={...S.items,[code]:{...i,lots:[...lots(i),{d:'',n:1}]}},d=days(tot(it));
out.push({i,gain:minD(d)-b+.001*(d.k-base.k),k:d.k-base.k})}
return out.sort((a,b)=>b.gain-a.gain).slice(0,5)}
function home(){const t=tot(S.items),d=days(t),n=need(),wd=S.waterL/(S.people*S.water);
const lim=Object.keys(d).reduce((a,k)=>d[k]<d[a]?k:a,'k');
const kc={p:t.p*4,c:t.c*4,f:t.f*9},ks=kc.p+kc.c+kc.f||1;
const R=recs();
return `<h1>Stockpile</h1><div class="card"><div class="rings">${ring(d.k,30,'var(--food)','days','Food · '+Math.round(t.k).toLocaleString()+' kcal')}${ring(wd,30,'var(--water)','days','Water · '+f1(S.waterL)+' L')}</div>
<p class="mute" style="margin-top:10px;font-size:13px">${S.people} ${S.people==1?'person':'people'} × ${S.kcal} kcal and ${S.water} L per day. Rings fill at 30 days.</p></div>
<div class="card"><b>Where the calories come from</b><div class="bar" style="margin:10px 0"><i style="width:${kc.p/ks*100}%;background:var(--pro)"></i><i style="width:${kc.c/ks*100}%;background:var(--food)"></i><i style="width:${kc.f/ks*100}%;background:var(--fat)"></i></div>
<small class="mute">Protein ${Math.round(kc.p/ks*100)}% · Carbs ${Math.round(kc.c/ks*100)}% · Fat ${Math.round(kc.f/ks*100)}% (target 15 / 50 / 35)</small></div>
<div class="card"><b>Days of supply by nutrient</b>${['k','p','c','f'].map(k=>`<div class="row"><span class="${k==lim&&t.k?'lim':''}">${NAMES[k]}${k==lim&&t.k?' (limits you)':''}<br><small>${Math.round(k=='k'?t.k:t[k])}${k=='k'?' kcal':' g'} of ${Math.round(n[k])}${k=='k'?' kcal':' g'} needed per day</small></span><b style="color:${COL[k]}">${f1(d[k])} d</b></div>`).join('')}</div>
${soon()}<div class="card"><b>Buy next</b>${R.length?R.map(r=>`<div class="row"><span>${r.i.name}<br><small>one more adds ${f1(r.k)} days of calories</small></span><b style="color:var(--ok)">+${f1(Math.max(r.gain,0))} d</b></div>`).join(''):'<p class="mute" style="margin-top:6px">Scan a few products first. Recommendations come from products you have scanned before.</p>'}
${wd<d.k?`<div class="row"><span>Water<br><small>to match your food supply</small></span><b style="color:var(--water)">+${f1((d.k-wd)*S.people*S.water)} L</b></div>`:''}</div>
${planCard()}${waterCard()}`}
function w(x){H().update({waterL:Math.max(0,Math.round((S.waterL+x)*1000)/1000)})}
function planText(){const n=S.people,N=need(),L=[];
for(const i of Object.values(S.items)){const q=valid(i);if(!q)continue;
const lt=lots(i).filter(l=>!(l.d&&l.d<today())).map(l=>l.n+(l.d?' (best before '+l.d+')':'')).join(', ');
L.push(`- ${i.name}: ${q} on hand [${lt}], ${i.g} g each; per 100 g: ${i.k?Math.round(i.k)+' kcal, protein '+f1(i.p)+' g, carbs '+f1(i.c)+' g, fat '+f1(i.f)+' g':'nutrition unknown'}`)}
if(!L.length)return '';
const pp=x=>Math.round(x/n);
return `Plan ONE full day of meals (breakfast, lunch, dinner, and snacks if needed) for ${n} ${n==1?'person':'people'}, using ONLY the food I have on hand listed below, plus water.

Daily targets per person: about ${S.kcal} kcal, ${pp(N.p)} g protein, ${pp(N.c)} g carbs, ${pp(N.f)} g fat.
Daily targets for the whole household: ${Math.round(N.k)} kcal, ${Math.round(N.p)} g protein, ${Math.round(N.c)} g carbs, ${Math.round(N.f)} g fat.

Rules:
- Make real, sensible meals that go together, not just a list of items.
- Do not use more of any item than I have on hand. Use items with the earliest best-before dates first.
- Give exact amounts (number of packages and grams) for each meal and who it serves.
- Work out calories, protein, carbs and fat for each meal from the per-100 g values below, show the arithmetic briefly, and give a day total compared with the targets.
- List anything you would need that is not on my list (salt, oil, spices) separately, and keep it minimal.
- Add short, simple cooking directions for each meal.
- If a balanced day is not possible with what I have, say which nutrient falls short and what single items to buy to fix it.

Food on hand:
${L.join('\n')}`}
function planCard(){return `<div class="card"><b>One-day meal plan</b><p class="mute" style="margin:6px 0 10px;font-size:13px">Builds a request using only the food you have on hand and your household's targets. Paste it into a Claude chat to get the meals.</p><div class="q" style="flex-wrap:wrap"><button class="pri" onclick="planCopy()">Copy plan request</button><button onclick="planShare()">Share…</button><button onclick="window.open('https://claude.ai/new','_blank')">Open Claude</button></div></div>`}
async function planCopy(){const t=planText();if(!t)return toast('Scan some food in first');try{await navigator.clipboard.writeText(t);toast('Copied. Paste it into a Claude chat.')}catch(e){toast('Copy failed. Try Share instead.')}}
async function planShare(){const t=planText();if(!t)return toast('Scan some food in first');try{navigator.share?await navigator.share({title:'Meal plan request',text:t}):(await navigator.clipboard.writeText(t),toast('Copied. Paste it into a Claude chat.'))}catch(e){}}
function waterCard(){let c;try{c=JSON.parse(localStorage.getItem('wc'))}catch(e){}c=c||{n:1,b:24,m:500};
return `<div class="card"><b>Water on hand</b><p style="font-size:26px;font-weight:800;margin:6px 0">${f1(S.waterL)} L</p>
<label>Cases × bottles per case × bottle size</label><div class="q" style="flex-wrap:nowrap"><input id="wn" type="number" min="1" value="${c.n}" style="width:30%"><span>×</span><input id="wb" type="number" min="1" value="${c.b}" style="width:30%"><span>×</span><input id="wm" type="number" min="1" value="${c.m}" style="width:30%"><span>mL</span></div>
<div class="q" style="margin:8px 0;flex-wrap:wrap"><button onclick="wset(24,500)">24 × 500 mL</button><button onclick="wset(40,500)">40 × 500 mL</button></div>
<div class="q"><button class="pri" style="flex:1" onclick="wcase(1)">Add cases</button><button style="flex:1" onclick="wcase(-1)">Remove cases</button></div>
<label>Single bottles (size from the mL box above)</label><div class="q"><button style="flex:1" onclick="wbot(-1)">− 1 bottle</button><button style="flex:1" onclick="wbot(1)">+ 1 bottle</button></div></div>`}
function wset(b,m){$('#wb').value=b;$('#wm').value=m}
function wvals(){return{n:Math.max(1,+$('#wn').value||1),b:Math.max(1,+$('#wb').value||1),m:Math.max(1,+$('#wm').value||1)}}
function wcase(sg){const c=wvals();localStorage.setItem('wc',JSON.stringify(c));const L=sg*c.n*c.b*c.m/1000;w(L);toast((sg>0?'+':'−')+f1(Math.abs(L))+' L water')}
function wbot(sg){const c=wvals();localStorage.setItem('wc',JSON.stringify(c));w(sg*c.m/1000);toast((sg>0?'+':'−')+c.m+' mL water')}
function scan(){return `<h1>Scan</h1><div class="seg"><button class="${mode=='in'?'on':''}" onclick="setMode('in')">Stock in</button><button class="${mode=='out'?'on out':''}" onclick="setMode('out')">Use up</button></div><div style="position:relative;border-radius:18px;overflow:hidden"><video id="v" playsinline muted style="display:block"></video><div class="guide"></div></div><div class="q" id="ctl" style="margin-top:8px;flex-wrap:wrap"></div><p class="mute" id="st" style="margin:8px 0">Center the barcode in the box. ${mode=='in'?'Each scan asks for the expiry date, then adds to your supply.':'Each scan removes 1, soonest expiry first.'}</p><div class="q"><input id="man" inputmode="numeric" placeholder="Type barcode digits"><button class="pri" onclick="handle($('#man').value.trim());$('#man').value=''">Go</button></div>`}
function setMode(m){mode=m;render()}
function soon(){const a=[],lim=inM(2),t=today();for(const i of Object.values(S.items))for(const l of lots(i))if(l.d&&l.d<=lim)a.push({n:i.name,d:l.d,q:l.n});a.sort((x,y)=>x.d<y.d?-1:1);
return `<div class="card"><b>Use soon</b>${a.length?a.slice(0,8).map(r=>`<div class="row"><span>${r.q} × ${r.n}</span><b style="color:${r.d<t?'var(--pro)':'var(--food)'}">${r.d<t?'Expired ':''}${r.d}</b></div>`).join(''):'<p class="mute" style="margin-top:6px">Nothing expires in the next 2 months.</p>'}${a.some(r=>r.d<t)?'<p class="mute" style="margin-top:6px;font-size:13px">Expired items are not counted in your days of supply.</p>':''}</div>`}
function row(i){return `<div class="row" style="align-items:flex-start"><span>${i.name}<br><small>${i.k&&i.g?i.g+' g · '+Math.round(i.k)+' kcal/100 g':'<span class="lim">No nutrition info. Tap Edit.</span>'}</small>${lots(i).map(l=>`<br><small class="${l.d&&l.d<today()?'lim':''}">${l.n} × ${l.d||'no date'}${l.d&&l.d<today()?' (expired)':''} <a href="#" onclick="event.preventDefault();adjLot('${i.code}','${l.d}',-1)" style="color:var(--pro)">remove 1</a></small>`).join('')}</span><span class="q" style="flex-direction:column;align-items:stretch"><button onclick="openSheet('${i.code}')">+ Add</button><button onclick="editItem('${i.code}')">Edit</button></span></div>`}
function pantry(){const o=pref(),a=Object.values(S.items);
const key=i=>lots(i).filter(l=>l.d&&l.n>0).map(l=>l.d).sort()[0]||'~';
a.sort(o.sort=='exp'?(x,y)=>key(x)<key(y)?-1:key(x)>key(y)?1:x.name.localeCompare(y.name):(x,y)=>x.name.localeCompare(y.name));
const bar=`<div class="seg"><button class="on" onclick="setPref('sort')">Sort: ${o.sort=='exp'?'Soonest expiry':'A–Z'}</button><button class="${o.cat?'on':''}" onclick="setPref('cat')">Categories: ${o.cat?'On':'Off'}</button></div>`;
if(!a.length)return `<h1>Pantry</h1>${bar}<div class="card"><p class="mute">Nothing scanned yet. Open Scan and set Stock in.</p></div>`;
if(!o.cat)return `<h1>Pantry</h1>${bar}<div class="card">${a.map(row).join('')}</div>`;
return `<h1>Pantry</h1>${bar}`+CATS.map(c=>{const g=a.filter(i=>catOf(i)==c);return g.length?`<h2>${c} (${g.length})</h2><div class="card">${g.map(row).join('')}</div>`:''}).join('')}
function edit(c,fn){const x=S.items[c],l=fn(lots(x).map(o=>({...o}))).filter(o=>o.n>0);return H().collection('items').doc(c).update({lots:l,qty:l.reduce((a,o)=>a+o.n,0)})}
const addLot=(c,d,n)=>edit(c,l=>{const o=l.find(x=>x.d==d);o?o.n+=n:l.push({d,n});return l});
const adjLot=(c,d,n)=>edit(c,l=>{const o=l.find(x=>x.d==d);if(o)o.n+=n;return l});
const useOne=c=>edit(c,l=>{l.sort((a,b)=>(a.d||'9')<(b.d||'9')?-1:1);if(l[0])l[0].n--;return l});
function openSheet(c){const i=S.items[c];busy=true;const s=document.createElement('div');s.id='sheet';
s.innerHTML=`<div class="card" style="position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;box-shadow:0 0 0 100vmax rgba(0,0,0,.6);max-width:536px;margin:auto"><b>${i.name}</b><p class="mute" style="font-size:13px">${total(i)} on hand</p><label>Expiry date</label><input id="ed" type="date" value="${lastD}"><div class="q" style="margin:8px 0;flex-wrap:wrap"><button onclick="$('#ed').value=inM(6)">+6 mo</button><button onclick="$('#ed').value=inM(12)">+1 yr</button><button onclick="$('#ed').value=inM(24)">+2 yr</button><button onclick="$('#ed').value=''">No date</button></div><label>How many?</label><input id="eq" type="number" min="1" value="1"><div class="q" style="margin-top:12px"><button class="pri" style="flex:1" onclick="sheetOk('${c}')">Add</button><button onclick="sheetX()">Cancel</button></div></div>`;
document.body.appendChild(s)}
function editItem(c){const i=S.items[c];busy=true;const s=document.createElement('div');s.id='sheet';
const F=(id,l,v,t)=>`<label>${l}</label><input id="${id}" ${t||'type="number" step="any"'} value="${String(v).replace(/"/g,'&quot;')}">`;
s.innerHTML=`<div class="card" style="position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));bottom:calc(76px + env(safe-area-inset-bottom));overflow:auto;z-index:5;box-shadow:0 0 0 100vmax rgba(0,0,0,.6);max-width:536px;margin:auto"><b>Edit product</b><p class="mute" style="font-size:13px">Barcode ${c}. Nutrition values are per 100 g.</p>${F('en','Name',i.name,'type="text"')}<label>Category</label><select id="ecat">${CATS.map(c=>`<option${c==catOf(i)?' selected':''}>${c}</option>`).join('')}</select>${F('eg','Package weight (g)',i.g)}${F('ek','Calories per 100 g',i.k)}${F('ep','Protein per 100 g (g)',i.p)}${F('ec','Carbs per 100 g (g)',i.c)}${F('ef','Fat per 100 g (g)',i.f)}<div class="q" style="margin-top:12px"><button class="pri" style="flex:1" onclick="editOk('${c}')">Save</button><button onclick="editLook('${c}')">Look up online</button></div><div class="q" style="margin-top:8px"><button onclick="editDel('${c}')" style="color:var(--pro)">Delete product</button><button onclick="sheetX()">Cancel</button></div></div>`;
document.body.appendChild(s)}
function editOk(c){const v=id=>$('#'+id).value;H().collection('items').doc(c).update({name:v('en').trim()||c,cat:$('#ecat').value,g:+v('eg')||0,k:+v('ek')||0,p:+v('ep')||0,c:+v('ec')||0,f:+v('ef')||0});toast('Saved');sheetX()}
function editDel(c){if(!confirm('Delete '+S.items[c].name+' and all its stock? This removes it for everyone in the household.'))return;H().collection('items').doc(c).delete();toast('Deleted');sheetX()}
async function editLook(c){toast('Looking up\u2026');const set=(id,v)=>{if(v)$('#'+id).value=v};let got=false;
try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=product_name,brands,nutriments,product_quantity,categories_tags`),j=await r.json();
if(j.status==1){const p=j.product,n=p.nutriments||{};if(+n['energy-kcal_100g']){got=true;const g=guessCat(p.categories_tags);if(g!='Other')$('#ecat').value=g;set('en',[(p.brands||'').split(',')[0],p.product_name].filter(Boolean).join(' '));set('eg',+p.product_quantity);set('ek',+n['energy-kcal_100g']);set('ep',+n.proteins_100g);set('ec',+n.carbohydrates_100g);set('ef',+n.fat_100g)}}}catch(e){}
if(!got){toast('Checking USDA database\u2026');const u=await usda(c);if(u){got=true;if(u.cat!='Other')$('#ecat').value=u.cat;set('en',u.name);set('eg',u.g);set('ek',u.k);set('ep',u.p);set('ec',u.c);set('ef',u.f)}}
toast(got?'Filled in. Check the numbers, then tap Save.':'Not found in either database. Enter the numbers by hand.')}
function sheetOk(c){const d=$('#ed').value,n=Math.max(1,+$('#eq').value||1);lastD=d;localStorage.setItem('lastd',d);addLot(c,d,n);navigator.vibrate&&navigator.vibrate(60);toast('+'+n+' '+S.items[c].name);sheetX()}
function sheetX(){$('#sheet').remove();busy=false;last={c:'',t:0};refresh()}
function setup(){return `<h1>Household</h1><div class="card"><label>People in the house</label><input type="number" min="1" value="${S.people}" onchange="H().update({people:Math.max(1,+this.value||1)})"><label>Calories per person per day</label><input type="number" value="${S.kcal}" onchange="H().update({kcal:+this.value||2000})"><label>Water per person per day (litres)</label><input type="number" step=".1" value="${S.water}" onchange="H().update({water:+this.value||3.8})"></div><div class="card"><b>Household code</b><p style="font-size:28px;font-weight:800;letter-spacing:3px;margin:6px 0">${hid}</p><div class="q"><button class="pri" onclick="share()">Invite someone</button><button onclick="leave()">Leave household</button></div></div><p class="mute">Targets assume 15% protein, 50% carbs, 35% fat of calories. Everyone in the household sees the same pantry live.</p>`}
async function usda(c){const T=x=>x.toLowerCase().replace(/\b\w/g,y=>y.toUpperCase());
try{for(const q of [...new Set([c,c.replace(/^0+/,'')])]){
const r=await fetch(`https://api.nal.usda.gov/fdc/v1/foods/search?query=${q}&dataType=Branded&pageSize=10&api_key=${USDA_KEY}`),j=await r.json();
const f=(j.foods||[]).find(x=>(x.gtinUpc||'').replace(/^0+/,'')==c.replace(/^0+/,''));if(!f)continue;
const nv=id=>{const o=(f.foodNutrients||[]).find(n=>n.nutrientId==id);return o?+o.value||0:0};
let g=0,m;const pw=f.packageWeight||'';if(m=pw.match(/(\d+\.?\d*)\s*g\b/i))g=+m[1];else if(m=pw.match(/(\d+\.?\d*)\s*oz/i))g=Math.round(+m[1]*28.35);
const slug=(f.foodCategory||'').toLowerCase().replace(/[^a-z]+/g,'-');
return{name:T([(f.brandName||f.brandOwner||'').trim(),f.description].filter(Boolean).join(' ')),g,k:nv(1008),p:nv(1003),c:nv(1005),f:nv(1004),cat:guessCat([slug,...slug.split('-')])}}}catch(e){}
return null}
async function lookup(c){let it=null;
try{const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${c}.json?fields=product_name,brands,nutriments,product_quantity,categories_tags`),j=await r.json();
if(j.status==1){const p=j.product,n=p.nutriments||{};it={code:c,name:[(p.brands||'').split(',')[0],p.product_name].filter(Boolean).join(' ')||c,g:+p.product_quantity||0,k:+n['energy-kcal_100g']||0,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0,qty:0,cat:guessCat(p.categories_tags)}}}catch(e){}
if(!it||!it.k){toast('Checking USDA database\u2026');const u=await usda(c);if(u){if(!it)it={code:c,qty:0,...u};else{it.k=u.k;it.p=u.p;it.c=u.c;it.f=u.f;if(!it.g)it.g=u.g;if(it.cat=='Other')it.cat=u.cat}}}
if(!it){const nm=prompt('Not found online. Product name?');if(!nm)return null;it={code:c,name:nm,g:0,k:0,p:0,c:0,f:0,qty:0,cat:'Other'}}
if(!it.k){const v=(prompt(`Per 100 g for ${it.name}: calories, protein, carbs, fat (e.g. 360,12,70,3)`)||'').split(',').map(Number);[it.k,it.p,it.c,it.f]=[v[0]||0,v[1]||0,v[2]||0,v[3]||0]}
if(!it.g)it.g=+prompt(`Package weight in grams for ${it.name}?`)||0;
return it}
async function handle(c){if(!c||busy)return;const n=Date.now();if(c===last.c&&n-last.t<2500)return;last={c,t:n};
let it=S.items[c];
if(!it){toast('Looking up '+c+'\u2026');it=await lookup(c);if(!it)return toast('Skipped '+c);it.lots=[];S.items[c]=it;H().collection('items').doc(c).set(it)}
if(mode=='in')return openSheet(c);
if(total(it)<1)return toast('None on hand: '+it.name);
useOne(c);navigator.vibrate&&navigator.vibrate(60);toast('\u22121 '+it.name+' \u2192 '+(total(it)-1))}
let tr=null,cams=[],tOn=false;
const openStream=id=>{const v={width:{ideal:1920},height:{ideal:1080}};if(id)v.deviceId={exact:id};else v.facingMode={ideal:'environment'};return navigator.mediaDevices.getUserMedia({video:v})};
async function startCam(){const v=$('#v');if(!v)return;tOn=false;
try{try{stream=await openStream(localStorage.getItem('cam')||'')}catch(e){stream=await openStream('')}v.srcObject=stream;await v.play()}catch(e){$('#st').textContent='Camera blocked. Allow camera access, or type the barcode below.';return}
tr=stream.getVideoTracks()[0];
try{const all=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind=='videoinput'),bk=all.filter(d=>/back|rear|environment/i.test(d.label));cams=bk.length?bk:all}catch(e){cams=[]}
const cap=(tr.getCapabilities&&tr.getCapabilities())||{};
try{if(cap.focusMode&&cap.focusMode.includes('continuous'))await tr.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
camCtl(cap);
if(!('BarcodeDetector' in window)){$('#st').textContent='This browser cannot read barcodes. Use Chrome on Android, or type the digits below.';return}
const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']}),cv=document.createElement('canvas'),cx=cv.getContext('2d');
timer=setInterval(async()=>{if(busy||v.readyState<2||!v.videoWidth)return;try{
const vw=v.videoWidth,vh=v.videoHeight,k=Math.max(v.clientWidth/vw,v.clientHeight/vh),vis=v.clientWidth/k,vih=v.clientHeight/k;
const sx=(vw-vis)/2+vis*.07,sy=(vh-vih)/2+vih*.30,sw=Math.round(vis*.86),sh=Math.round(vih*.40);
cv.width=sw;cv.height=sh;cx.drawImage(v,sx,sy,sw,sh,0,0,sw,sh);
const r=await det.detect(cv);if(r[0])handle(r[0].rawValue)}catch(e){}},250)}
function camCtl(cap){const el=$('#ctl');if(!el)return;let h='';
if(cap.zoom){const z=cap.zoom,sv=Math.min(z.max,Math.max(z.min,+localStorage.getItem('zm')||2));h+=`<span class="mute" style="font-size:13px">Zoom</span><input id="zm" type="range" min="${z.min}" max="${z.max}" step="${z.step||.1}" value="${sv}" style="flex:1;padding:0" oninput="setZoom(this.value)">`;setTimeout(()=>setZoom(sv),0)}
if(cap.torch)h+='<button id="tb" onclick="torch()">Light</button>';
if(cams.length>1)h+='<button onclick="nextCam()">Switch camera</button>';
el.innerHTML=h}
function setZoom(x){localStorage.setItem('zm',x);tr&&tr.applyConstraints({advanced:[{zoom:+x}]}).catch(()=>{})}
function torch(){tOn=!tOn;tr.applyConstraints({advanced:[{torch:tOn}]}).catch(()=>{});$('#tb').classList.toggle('pri',tOn)}
function nextCam(){const cur=tr.getSettings().deviceId,i=cams.findIndex(d=>d.deviceId==cur),n=cams[(i+1)%cams.length];localStorage.setItem('cam',n.deviceId);stopCam();startCam()}
function stopCam(){clearInterval(timer);stream&&stream.getTracks().forEach(t=>t.stop());stream=null}
let tt;function toast(m){const t=$('#toast'),sh=!!$('#sheet');t.style.bottom=sh?'auto':'';t.style.top=sh?'calc(12px + env(safe-area-inset-top))':'';t.textContent=m;t.className='show';clearTimeout(tt);tt=setTimeout(()=>t.className='',3000)}
function joinView(){return `<h1>Stockpile</h1><div class="card"><b>Join a household</b><label>Household code</label><input id="code" value="${P||''}" autocapitalize="characters" placeholder="e.g. K7M2QX9P"><div class="q" style="margin-top:10px"><button class="pri" onclick="joinH($('#code').value)">Join</button></div></div><div class="card"><b>Start a new household</b><p class="mute" style="margin:6px 0 10px">You get a code to share with the people you live with.</p><button class="pri" onclick="createH()">Create household</button></div>`}
async function joinH(c){c=(c||'').trim().toUpperCase();if(!c)return;hid=c;const d=await H().get();if(!d.exists){hid='';return toast('No household with that code')}start(c)}
async function createH(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<8;i++)c+=A[Math.random()*A.length|0];hid=c;await H().set({people:2,kcal:2000,water:3.8,waterL:0});start(c)}
function start(c){hid=c;localStorage.setItem('hid',c);unsubs.forEach(u=>u());S.items={};
unsubs=[H().onSnapshot(d=>{if(d.exists){Object.assign(S,d.data());refresh()}}),H().collection('items').onSnapshot(q=>{S.items={};q.forEach(d=>S.items[d.id]={code:d.id,...d.data()});refresh()})];view='home';render()}
function leave(){if(!confirm('Leave this household on this phone? Its data stays for the others.'))return;unsubs.forEach(u=>u());localStorage.removeItem('hid');hid='';render()}
async function share(){const u=location.origin+location.pathname+'?h='+hid,t='Join my Stockpile household. Code: '+hid;try{navigator.share?await navigator.share({title:'Stockpile',text:t,url:u}):(await navigator.clipboard.writeText(t+' '+u),toast('Invite copied'))}catch(e){}}
function refresh(){if(view!='scan'&&document.activeElement.tagName!='INPUT')render()}
function render(){stopCam();const nv=$('nav');nv.style.display=hid?'flex':'none';
$('#app').innerHTML=hid?{home,scan,pantry,setup}[view]():joinView();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));if(hid&&view=='scan')startCam()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render()});
if(FIREBASE_CONFIG.apiKey.startsWith('PASTE')){$('#app').innerHTML='<h1>Stockpile</h1><div class="card"><b>Firebase not set up yet</b><p class="mute" style="margin-top:6px">Open this file and paste your Firebase web config into FIREBASE_CONFIG near the top of the script.</p></div>';$('nav').style.display='none'}
else{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
firebase.auth().signInAnonymously().then(()=>hid?start(hid):render()).catch(e=>{$('#app').innerHTML='<div class="card"><b>Sign-in failed</b><p class="mute">'+e.message+'</p></div>'})}
</script></body></html>
